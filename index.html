<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolo Rishikesh</title>
<meta name="description" content="Report cleanliness problems in Rishikesh in three taps, and learn how to respect Maa Ganga.">
<meta name="theme-color" content="#1d5bd6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M24 3C12.4 3 3 10.8 3 20.5c0 5.3 2.8 10 7.2 13.2L8.5 44l10.3-6.3c1.7.4 3.4.6 5.2.6 11.6 0 21-7.8 21-17.8S35.6 3 24 3z' fill='%231d5bd6'/><path d='M12 19l6-7 4.5 4.5L27 11l9 8' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M10 27c3.5 0 3.5-2.6 7-2.6s3.5 2.6 7 2.6 3.5-2.6 7-2.6 3.5 2.6 7 2.6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Bolo Rishikesh — one file, no server, no database.
   Blue & white flat-vector theme. All icons are inline SVG.
   ========================================================= */
:root{
  --blue:#1d5bd6; --blue-deep:#123f9e; --navy:#0a2463;
  --sky:#d6e4ff; --sky-2:#b9cffd; --mist:#f1f5ff; --white:#ffffff;
  --ink:#0a1b3d; --muted:#4b5a7a; --line:#d7e1f5;
  --flame:#ffb020;  /* used ONLY for diya flames & flowers */
  --display:"Baloo 2","Mukta",system-ui,sans-serif;
  --body:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--body);background:var(--mist);color:var(--ink);font-size:18px;line-height:1.5;min-height:100vh}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
svg{display:block}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}

/* Top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--navy);cursor:pointer;line-height:1;white-space:nowrap}
.brand svg{width:34px;height:34px}
.langs{display:flex;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;min-width:38px;padding:6px 8px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.langs button.on{background:var(--blue);color:#fff}
.view{display:none}
.view.on{display:block}

/* Hero — the one bold element: a vector Rishikesh scene */
.hero{background:var(--white);border-radius:28px;overflow:hidden;border:1.5px solid var(--line)}
.hero .copy{padding:22px 22px 4px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.6vw,40px);line-height:1.06;margin:0 0 8px;color:var(--navy);letter-spacing:-.01em;max-width:14ch}
.hero p{margin:0;color:var(--muted);max-width:30ch}
.scene{width:100%;height:auto;margin-top:6px}
.scene .w1{animation:drift 9s linear infinite}
.scene .w2{animation:drift 14s linear infinite reverse}
.scene .diya{animation:bob 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}

/* Home actions */
.act{display:flex;align-items:center;gap:16px;width:100%;text-align:start;border:0;cursor:pointer}
.act b{display:block;font-family:var(--display);font-weight:800;line-height:1.1}
.act span{display:block;font-size:15px}
.act .ico{flex:none;display:grid;place-items:center;border-radius:50%}
.act-report{margin-top:14px;background:var(--blue);color:#fff;border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--blue-deep)}
.act-report b{font-size:27px}
.act-report span{color:#cfe0ff}
.act-report .ico{width:64px;height:64px;background:#fff}
.act-report .ico svg{width:40px;height:40px}
.act-report:active{transform:translateY(3px);box-shadow:0 3px 0 var(--blue-deep)}
.act-ganga{margin-top:14px;background:var(--white);color:var(--navy);border-radius:18px;padding:14px 18px;border:1.5px solid var(--line)}
.act-ganga b{font-size:21px}
.act-ganga span{color:var(--muted)}
.act-ganga .ico{width:52px;height:52px;background:var(--sky)}
.act-ganga .ico svg{width:34px;height:34px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:20px 10px 0}

/* Report flow */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--blue);font-weight:700;padding:6px 0;cursor:pointer;font-size:17px}
.back svg{width:20px;height:20px}
[dir=rtl] .back svg{transform:scaleX(-1)}
h2{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;margin:4px 0 6px;color:var(--navy)}
.step{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:21px;margin:26px 0 12px;color:var(--ink)}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;flex:none}
.panel{background:var(--white);border-radius:18px;padding:16px;border:1.5px solid var(--line)}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--white);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.cat .art{background:var(--mist);border-radius:12px;display:grid;place-items:center;padding:8px 0}
.cat .art svg{width:60px;height:60px}
.cat .t{font-weight:700;font-size:16px;line-height:1.2}
.cat.on{border-color:var(--blue);background:var(--sky)}
.cat.on .art{background:#fff}
.cat:last-child{grid-column:1/-1;flex-direction:row;align-items:center}
.cat:last-child .art{padding:4px}
.cat:last-child .art svg{width:40px;height:40px}

.photoBox{display:flex;flex-direction:column;gap:10px}
.preview{width:100%;border-radius:12px;display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:18px;cursor:pointer;text-decoration:none}
.btn svg{width:24px;height:24px}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600;padding:6px;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--sky);color:var(--navy);font-size:15px;font-weight:700}
.chip svg{width:18px;height:18px}
.chip.warn{background:#fff;border:1.5px dashed var(--sky-2)}
select{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);background:#fff;margin-top:10px}

/* Send — ranked */
.send{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:14px;cursor:pointer;text-align:start}
.sbtn .i{flex:none;display:grid;place-items:center;border-radius:50%}
.sbtn .i svg{width:26px;height:26px}
.sbtn b{display:block;font-size:17px;line-height:1.2}
.sbtn span{display:block;font-size:13px;line-height:1.3}
.sbtn.email{grid-column:1/-1;background:var(--blue);color:#fff;padding:18px;box-shadow:0 5px 0 var(--blue-deep)}
.sbtn.email b{font-family:var(--display);font-weight:800;font-size:23px}
.sbtn.email span{color:#cfe0ff}
.sbtn.email .i{width:52px;height:52px;background:#fff}
.sbtn.email .i svg{width:32px;height:32px}
.sbtn.email:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-deep)}
.sbtn.share{grid-column:1/-1;background:var(--navy);color:#fff}
.sbtn.share span{color:#c3d2f2}
.sbtn.share .i{width:44px;height:44px;background:rgba(255,255,255,.14)}
.sbtn.x,.sbtn.copy{background:var(--white);color:var(--ink);border:1.5px solid var(--line);flex-direction:column;align-items:flex-start;gap:6px}
.sbtn.x span,.sbtn.copy span{color:var(--muted)}
.sbtn.x .i,.sbtn.copy .i{width:40px;height:40px;background:var(--sky)}
.sbtn.x .i svg,.sbtn.copy .i svg{width:22px;height:22px}

details.msgbox{margin-top:16px}
details.msgbox summary{cursor:pointer;font-weight:700;color:var(--blue);padding:6px 0;font-size:17px}
textarea{width:100%;min-height:170px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.45;background:#fbfcff;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin:6px 2px 0}
.portals{margin-top:16px}
.portals b{font-family:var(--display);font-weight:600;font-size:19px;color:var(--navy)}
.portals a{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--navy);font-weight:700;text-decoration:none}
.portals a:last-child{border-bottom:0}
.portals a svg{width:22px;height:22px;color:var(--blue);flex:none}
.portals a .chev{margin-inline-start:auto;width:18px;height:18px;color:var(--muted)}
[dir=rtl] .portals a .chev{transform:scaleX(-1)}
.btn.soft{background:var(--sky);color:var(--navy)}
.privacy{font-size:14px;color:var(--muted);text-align:center;margin-top:18px}
.hidden{display:none!important}

/* Respect Ganga */
.gcard{border-radius:26px;overflow:hidden;background:var(--white);border:1.5px solid var(--line);min-height:380px;display:flex;flex-direction:column}
.gcard .art{background:var(--sky)}
.gcard .art svg{width:100%;height:auto}
.gcard .txt{padding:18px 22px 24px}
.gcard h3{font-family:var(--display);font-weight:800;margin:0 0 8px;font-size:27px;line-height:1.1;color:var(--navy)}
.gcard p{margin:0;font-size:19px;color:#25365a}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--blue);width:26px}
.nav2{display:flex;gap:10px}
.nav2 .btn{flex:1}
.btn.big{font-family:var(--display);font-weight:800;font-size:20px;background:var(--navy);color:#fff}
#pledgeImg{width:100%;border-radius:18px;margin-top:14px;display:none}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;max-width:90vw;text-align:center;transition:transform .25s,opacity .25s;opacity:0;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" onclick="go('home')" role="link" tabindex="0"><span data-icon="logo"></span><span id="brandName"></span></div>
    <div class="langs" id="langs"></div>
  </header>

  <!-- ============ HOME ============ -->
  <section class="view" id="v-home">
    <div class="hero">
      <div class="copy">
        <h1 data-t="tagline"></h1>
        <p data-t="heroSub"></p>
      </div>
      <!-- Vector scene: hills, temple, suspension bridge, the Ganga, a floating diya -->
      <svg class="scene" viewBox="0 0 360 200" aria-hidden="true">
        <defs><clipPath id="riverClip"><rect x="0" y="150" width="360" height="50"/></clipPath></defs>
        <circle cx="292" cy="42" r="20" fill="#d6e4ff"/>
        <path d="M268 30l5 3M312 30l-5 3" stroke="#fff" stroke-width="0"/>
        <path d="M60 38l5 4 5-4M84 28l4 3 4-3" stroke="#0a2463" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0 110 L46 62 L80 92 L128 44 L176 96 L214 70 L262 108 L306 66 L360 104 V160 H0Z" fill="#d6e4ff"/>
        <path d="M128 44 L144 61 L136 59 L128 66 L120 58 L113 60Z M306 66 L320 80 L313 79 L306 85 L300 79 L294 80Z" fill="#fff"/>
        <path d="M0 132 C40 110 80 118 120 126 C170 136 210 112 260 118 C300 122 330 112 360 116 V160 H0Z" fill="#b9cffd"/>
        <!-- temple -->
        <g transform="translate(26 86)">
          <path d="M18 0 V-10" stroke="#0a2463" stroke-width="2"/>
          <path d="M18 -10 L28 -7 L18 -4Z" fill="#1d5bd6"/>
          <path d="M18 0 C10 8 8 16 8 22 H28 C28 16 26 8 18 0Z" fill="#1d5bd6" stroke="#0a2463" stroke-width="2" stroke-linejoin="round"/>
          <path d="M4 22 H32 V58 H4Z" fill="#fff" stroke="#0a2463" stroke-width="2"/>
          <path d="M13 58 V44 a5 5 0 0 1 10 0 V58" fill="#d6e4ff" stroke="#0a2463" stroke-width="2"/>
          <path d="M4 30 H32" stroke="#0a2463" stroke-width="2"/>
        </g>
        <!-- suspension bridge -->
        <g stroke="#0a2463" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M112 146 V92 M124 146 V92 M112 100 H124 M112 92 H124"/>
          <path d="M296 146 V92 M308 146 V92 M296 100 H308 M296 92 H308"/>
          <path d="M66 140 Q90 120 118 92 Q210 150 302 92 Q326 118 350 140"/>
          <path d="M100 140 H330" stroke-width="4"/>
          <g stroke-width="1.6"><path d="M140 140V106M160 140V117M180 140V124M200 140V127M220 140V127M240 140V124M260 140V117M280 140V106M88 140V114M100 140V105M318 140V106M332 140V118"/></g>
        </g>
        <!-- river -->
        <rect x="0" y="150" width="360" height="50" fill="#1d5bd6"/>
        <g clip-path="url(#riverClip)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <path class="w1" d="M0 166 c15 0 15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6"/>
          <path class="w2" d="M-60 184 c15 0 15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6 s15 -6 30 -6 s15 6 30 6" opacity=".55"/>
        </g>
        <!-- diya on leaf -->
        <g transform="translate(196 156)"><g class="diya">
          <path d="M-22 10 C-12 20 12 20 22 10 C10 14 -10 14 -22 10Z" fill="#b9cffd" stroke="#0a2463" stroke-width="2" stroke-linejoin="round"/>
          <path d="M-10 10 C-10 4 10 4 10 10Z" fill="#fff" stroke="#0a2463" stroke-width="2"/>
          <path d="M0 4 C-5 -2 -2 -8 0 -12 C2 -8 5 -2 0 4Z" fill="#ffb020" stroke="#0a2463" stroke-width="1.6"/>
        </g></g>
      </svg>
    </div>
    <button class="act act-report" onclick="go('report')">
      <div class="ico" data-icon="megaphone"></div><div><b data-t="reportBtn"></b><span data-t="reportSub"></span></div>
    </button>
    <button class="act act-ganga" onclick="go('ganga')">
      <div class="ico" data-icon="diya"></div><div><b data-t="gangaBtn"></b><span data-t="gangaSub"></span></div>
    </button>
    <p class="note" data-t="privacy"></p>
  </section>

  <!-- ============ REPORT ============ -->
  <section class="view" id="v-report">
    <button class="back" onclick="go('home')"><span data-icon="arrow"></span><span data-t="back"></span></button>
    <h2 data-t="chooseIssue"></h2>

    <h3 class="step"><span class="n">1</span><span data-t="s1"></span></h3>
    <div class="cats" id="cats"></div>

    <div id="afterCat" class="hidden">
      <h3 class="step"><span class="n">2</span><span data-t="s2"></span></h3>
      <div class="panel photoBox">
        <img id="preview" class="preview" alt="">
        <label class="btn primary" for="cam"><span data-icon="camera"></span><span id="camLabel"></span></label>
        <input id="cam" type="file" accept="image/*" capture="environment" hidden>
        <button class="btn ghost" id="skipBtn" onclick="skipPhoto()" data-t="skip"></button>
        <div>
          <span class="chip" id="locChip"></span>
          <select id="areaSel" class="hidden" onchange="pickArea(this.value)"></select>
        </div>
      </div>
    </div>

    <div id="sendBlock" class="hidden">
      <h3 class="step"><span class="n">3</span><span data-t="s3"></span></h3>
      <div class="send">
        <button class="sbtn email" onclick="sendEmail()"><div class="i" data-icon="mail"></div><div><b data-t="email"></b><span data-t="emailSub"></span></div></button>
        <button class="sbtn share" onclick="sendShare()"><div class="i" data-icon="chat"></div><div><b data-t="share"></b><span data-t="shareSub"></span></div></button>
        <button class="sbtn x" onclick="sendX()"><div class="i" data-icon="x"></div><b data-t="x"></b><span data-t="xSub"></span></button>
        <button class="sbtn copy" onclick="copyText()"><div class="i" data-icon="copy"></div><b data-t="copy"></b><span data-t="copySub"></span></button>
      </div>

      <details class="msgbox">
        <summary data-t="ready"></summary>
        <textarea id="msg" aria-label="Complaint text"></textarea>
        <p class="hint" data-t="edit"></p>
      </details>

      <div class="panel portals" id="portals"></div>
      <button class="btn soft" style="margin-top:14px" onclick="resetReport()" data-t="newReport"></button>
    </div>
    <p class="privacy" data-t="privacy"></p>
  </section>

  <!-- ============ RESPECT GANGA ============ -->
  <section class="view" id="v-ganga">
    <button class="back" onclick="go('home')"><span data-icon="arrow"></span><span data-t="back"></span></button>
    <div id="gcard" class="gcard"></div>
    <div class="dots" id="dots"></div>
    <div class="nav2">
      <button class="btn soft" id="prevBtn" onclick="card(-1)" data-t="prev"></button>
      <button class="btn primary" id="nextBtn" onclick="card(1)" data-t="next"></button>
    </div>
    <button class="btn big hidden" id="pledgeBtn" style="margin-top:12px" onclick="makePledge()"><span data-icon="diyaWhite"></span><span data-t="pledge"></span></button>
    <img id="pledgeImg" alt="">
    <button class="btn primary hidden" id="pledgeShare" style="margin-top:10px" onclick="sharePledge()" data-t="pledgeShare"></button>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIG — the only part you normally need to edit.
   Change something here, commit on GitHub, and it's live.
   ========================================================= */
const CONFIG = {
  // App name per language (change it when you pick the final name)
  appName: {en:"Bolo Rishikesh", hi:"बोलो ऋषिकेश", ru:"Боло Ришикеш", he:"בולו רישיקש"},

  // Who receives the email for each issue. "all" is added to every category.
  emails: {
    all:      ["npprishikesh@gmail.com",   // Nagar Nigam Rishikesh — VERIFY (third-party directory)
               "cm-helpline@uk.gov.in"],   // Uttarakhand CM Helpline (official)
    garbage: [], cattle: [], plastic: [], urination: [], food: [], sewage: [], other: []
  },

  // Accounts tagged in the public X post.
  xHandles: [
    "@ukcmo",          // Uttarakhand Chief Minister's Office (confirmed)
    "@pushkardhami",   // CM Pushkar Singh Dhami (confirmed)
    "@BJP4UK",         // BJP Uttarakhand — VERIFY on X before going live
    // "@HANDLE_HERE", // Rishikesh MLA — add the verified handle here
  ],
  hashtags: ["#BoloRishikesh", "#Rishikesh", "#NamamiGange"],

  cmHelplineTel: "1905",
  cmPortal: "https://cmhelpline.uk.gov.in/",
  nagarNigamTel: "+919084520350",           // VERIFY (third-party directory)
  nagarNigamSite: "https://nnrishikesh.uk.gov.in/"
};

/* ---------------- Custom vector icons ----------------
   48×48 duotone: navy outline, blue / sky / white fills.  */
const N="#0a2463", B="#1d5bd6", K="#d6e4ff", K2="#b9cffd", W="#fff", F="#ffb020";
const st = `stroke="${N}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"`;
const wave = (y,c=B) => `<path d="M4 ${y}c4 0 4-3 8-3s4 3 8 3 4-3 8-3 4 3 8 3 4-3 8-3" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>`;

const LANGS = [["en","EN"],["hi","हि"],["ru","RU"],["he","עב"]];
let lang = detectLang();
const S = {cat:null, photo:null, lat:null, lng:null, place:null, locState:"idle"};
let gi = 0, pledgeFile = null, userEdited = false;

function detectLang(){
  try{ const s = localStorage.getItem("cr_lang"); if(s && T[s]) return s; }catch(e){}
  const n = (navigator.language||"en").toLowerCase();
  if(n.startsWith("hi")) return "hi";
  if(n.startsWith("ru")) return "ru";
  if(n.startsWith("he")||n.startsWith("iw")) return "he";
  return "en";
}
const t = k => (T[lang][k] ?? T.en[k] ?? k);
const $ = id => document.getElementById(id);
const appName = () => CONFIG.appName[lang] || CONFIG.appName.en;

function setLang(l){
  lang = l; try{ localStorage.setItem("cr_lang", l); }catch(e){}
  document.documentElement.lang = l;
  document.documentElement.dir = l==="he" ? "rtl" : "ltr";
  render();
}
function render(){
  document.title = appName();
  $("brandName").textContent = appName();
  $("langs").innerHTML = LANGS.map(([k,v])=>`<button class="${k===lang?"on":""}" onclick="setLang('${k}')" aria-pressed="${k===lang}">${v}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-icon]").forEach(el=>{ el.innerHTML = ICON[el.dataset.icon]||""; });
  $("cats").innerHTML = CATS.map(c=>`<button class="cat ${S.cat===c.id?"on":""}" onclick="chooseCat('${c.id}')" aria-pressed="${S.cat===c.id}"><span class="art">${ICON[c.id]}</span><span class="t">${c[lang]||c.en}</span></button>`).join("");
  $("camLabel").textContent = S.photo ? t("retake") : t("takePhoto");
  $("areaSel").innerHTML = `<option value="">${t("pickArea")}</option>` + PLACES.map(p=>`<option value="${p.id}" ${S.place&&S.place.id===p.id?"selected":""}>${lang==="hi"?p.hi:p.en}</option>`).join("");
  const row=(href,ic,label,ext)=>`<a href="${href}" ${ext?'target="_blank" rel="noopener"':""}>${ICON[ic]}<span>${label}</span><span class="chev">${ICON.chev}</span></a>`;
  $("portals").innerHTML = `<b>${t("portalsTitle")}</b>`+
    row(`tel:${CONFIG.cmHelplineTel}`,"phone",t("callCM"))+
    row(CONFIG.cmPortal,"globe",t("cmPortal"),1)+
    row(`tel:${CONFIG.nagarNigamTel}`,"phone",t("callNN"))+
    row(CONFIG.nagarNigamSite,"globe",t("nnSite"),1);
  renderLoc(); renderCard();
}

/* ---------------- Navigation ---------------- */
function go(v){ if(location.hash !== "#"+v) location.hash = v; else show(v); }
function show(v){
  if(!["home","report","ganga"].includes(v)) v = "home";
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  if(v==="report") startLocation();
  if(v==="ganga"){ gi = 0; renderCard(); }
  window.scrollTo(0,0);
}
document.querySelector(".brand").addEventListener("keydown",e=>{ if(e.key==="Enter") go("home"); });
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)));

/* ---------------- Location ---------------- */
function startLocation(){
  if(S.locState==="ok"||S.locState==="getting") return;
  if(!("geolocation" in navigator)){ S.locState="fail"; renderLoc(); return; }
  S.locState="getting"; renderLoc();
  navigator.geolocation.getCurrentPosition(pos=>{
    S.lat = pos.coords.latitude; S.lng = pos.coords.longitude;
    S.place = nearestPlace(S.lat, S.lng); S.locState="ok"; renderLoc(); update();
  }, ()=>{ S.locState="fail"; renderLoc(); update(); }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
function distKm(a,b,c,d){ const r=x=>x*Math.PI/180; const dl=r(c-a),dn=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 12742*Math.asin(Math.sqrt(h)); }
function nearestPlace(lat,lng){
  let best=null,bd=1e9;
  PLACES.forEach(p=>{ if(p.lat==null) return; const d=distKm(lat,lng,p.lat,p.lng); if(d<bd){bd=d;best=p;} });
  return bd<=0.7 ? best : null;
}
function pickArea(id){ S.place = PLACES.find(p=>p.id===id)||null; renderLoc(); update(); }
function placeEn(){ if(S.place) return (S.lat!=null&&S.place.lat!=null?"near ":"")+S.place.en+", Rishikesh"; return "Rishikesh"; }
function phraseEn(){ const p=placeEn(); return p.startsWith("near ")?p:(S.place?"at "+p:"in "+p); }
function placeHi(){ if(S.place) return S.place.hi+(S.lat!=null&&S.place.lat!=null?" के पास":"")+", ऋषिकेश"; return "ऋषिकेश"; }
function mapsLink(){ return S.lat!=null ? `https://maps.google.com/?q=${S.lat.toFixed(6)},${S.lng.toFixed(6)}` : ""; }
function renderLoc(){
  const chip=$("locChip"), sel=$("areaSel"); if(!chip) return;
  chip.className="chip"; sel.classList.add("hidden");
  if(S.locState==="getting"){ chip.innerHTML=ICON.pinOff+`<span>${t("locGetting")}</span>`; }
  else if(S.locState==="ok"){ chip.innerHTML=ICON.pin+`<span>${S.place?(lang==="hi"?S.place.hi:S.place.en):`${S.lat.toFixed(4)}, ${S.lng.toFixed(4)}`}</span>`; }
  else if(S.locState==="fail"){ chip.classList.add("warn"); chip.innerHTML=ICON.pinOff+`<span>${t("locFail")}</span>`; sel.classList.remove("hidden"); }
}

/* ---------------- Category ---------------- */
function chooseCat(id){
  S.cat=id; render();
  $("afterCat").classList.remove("hidden");
  $("sendBlock").classList.remove("hidden");
  update();
  setTimeout(()=>$("afterCat").scrollIntoView({behavior:"smooth",block:"start"}),60);
}

/* ---------------- Photo: resize + stamp date/time/location ---------------- */
$("cam").addEventListener("change", async e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{ S.photo = await stampPhoto(f); }catch(err){ S.photo = f; }
  $("preview").src = URL.createObjectURL(S.photo); $("preview").style.display="block";
  $("skipBtn").classList.add("hidden");
  render(); update();
  setTimeout(()=>$("sendBlock").scrollIntoView({behavior:"smooth",block:"start"}),80);
});
function skipPhoto(){ $("skipBtn").classList.add("hidden"); $("sendBlock").scrollIntoView({behavior:"smooth",block:"start"}); }
function loadImg(file){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
async function stampPhoto(file){
  const img = await loadImg(file);
  const sc=Math.min(1, 1600/Math.max(img.width,img.height));
  const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
  x.drawImage(img,0,0,w,h);
  const fs=Math.max(16,Math.round(w/34)), pad=Math.round(fs*.7), bh=fs*2.6+pad;
  x.fillStyle="rgba(10,36,99,.78)"; x.fillRect(0,h-bh,w,bh);
  x.fillStyle="#fff"; x.font=`600 ${fs}px system-ui,sans-serif`; x.textBaseline="top";
  x.fillText(`Location: ${placeEn()}${S.lat!=null?`  (${S.lat.toFixed(5)}, ${S.lng.toFixed(5)})`:""}`,pad,h-bh+pad*.6,w-pad*2);
  x.fillText(`Time: ${nowStr()}   |   ${CONFIG.appName.en} report`,pad,h-bh+pad*.6+fs*1.3,w-pad*2);
  const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  return new File([blob], `rishikesh-report-${Date.now()}.jpg`, {type:"image/jpeg"});
}

function nowStr(){ return new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
const cat = () => CATS.find(c=>c.id===S.cat);
function subject(){ const c=cat(); return `Complaint: ${c.en} ${phraseEn()} | शिकायत: ${c.hi}`; }
function buildMsg(){
  const c=cat(); if(!c) return "";
  const m=mapsLink(), when=nowStr();
  return `Respected Sir/Madam,

I wish to bring the following problem ${phraseEn()} to your notice: ${c.dEn}.

Issue: ${c.en}
Date & time: ${when}
Location: ${placeEn()}${m?`\nMap: ${m}`:""}
Photo: ${S.photo?"attached (date, time and location stamped on it)":"not attached"}

Kindly take necessary action at the earliest.

Thank you,
A concerned citizen / visitor

————————————
आदरणीय महोदय/महोदया,

आपके संज्ञान में निम्न समस्या लाना चाहते हैं — ${placeHi()}: ${c.dHi}।

समस्या: ${c.hi}
दिनांक व समय: ${when}
स्थान: ${placeHi()}${m?`\nमानचित्र: ${m}`:""}
फ़ोटो: ${S.photo?"संलग्न (तारीख, समय और स्थान अंकित)":"संलग्न नहीं"}

कृपया शीघ्र आवश्यक कार्रवाई करें।

धन्यवाद,
एक जागरूक नागरिक`;
}
$("msg").addEventListener("input",()=>{ userEdited=true; });
function update(){ if(S.cat && !userEdited) $("msg").value = buildMsg(); }
const msgText = () => $("msg").value || buildMsg();
const recipients = () => [...new Set([...(CONFIG.emails.all||[]), ...(CONFIG.emails[S.cat]||[])])];

/* X post text, kept within 280 characters (links count as 23) */
function tweetText(){
  const c=cat(), m=mapsLink();
  const tags=CONFIG.xHandles.join(" "), hash=CONFIG.hashtags.join(" ");
  let body=`${c.en} ${phraseEn()} (${nowStr()}). Please take action.`;
  const len = s => s.length + (m ? 24 : 0);
  let s=`${body}\n${tags}\n${hash}`;
  if(len(s)>280) s=`${body}\n${tags}\n#BoloRishikesh`;
  if(len(s)>280) s=`${c.en} ${phraseEn()}. Please take action.\n${tags}`;
  return m ? `${s}\n${m}` : s;
}

/* ---------------- Send actions ---------------- */
function saveFile(file){
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
const canShareFile = f => !!(f && navigator.canShare && navigator.canShare({files:[f]}));

function sendEmail(){
  if(S.photo){ saveFile(S.photo); toast(t("photoSaved"), 4500); }
  const to=recipients().join(","), su=encodeURIComponent(subject()), bd=encodeURIComponent(msgText());
  const isPhone = matchMedia("(pointer:coarse)").matches;
  // Phones: the mail app (usually Gmail). Computers: Gmail in a new tab, since many have no mail app set up.
  if(isPhone) setTimeout(()=>{ location.href=`mailto:${to}?subject=${su}&body=${bd}`; }, S.photo?700:0);
  else window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to)}&su=${su}&body=${bd}`,"_blank");
}
async function sendShare(){
  const text = `${subject()}\n\n${msgText()}`;
  try{
    if(canShareFile(S.photo)){ await navigator.share({files:[S.photo], text, title:subject()}); return; }
    if(navigator.share){ await navigator.share({text, title:subject()}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  toast(t("noShare"));
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
}
/* X: X's web link cannot carry a photo, so on phones we open the share sheet
   with photo + text together; the person picks X and everything is attached. */
async function sendX(){
  const s = tweetText();
  if(canShareFile(S.photo)){
    toast(t("pickX"), 4500);
    try{ await navigator.share({files:[S.photo], text:s}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  if(S.photo){ saveFile(S.photo); toast(t("photoSavedX"), 4500); }
  window.open(`https://x.com/intent/post?text=${encodeURIComponent(s)}`,"_blank");
}
async function copyText(){
  const txt=msgText();
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=$("msg"); ta.closest("details").open=true; ta.select(); document.execCommand("copy"); }
  toast(t("copied"));
}
function resetReport(){
  S.cat=null; S.photo=null; userEdited=false; $("msg").value="";
  $("preview").style.display="none"; $("cam").value="";
  $("afterCat").classList.add("hidden"); $("sendBlock").classList.add("hidden"); $("skipBtn").classList.remove("hidden");
  render(); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------------- Respect Ganga cards + pledge ---------------- */
function renderCard(){
  const list=GANGA[lang]||GANGA.en, el=$("gcard"); if(!el) return;
  const [h,p]=list[gi];
  el.innerHTML=`<div class="art" aria-hidden="true">${ART[gi]}</div><div class="txt"><h3>${h}</h3><p>${p}</p></div>`;
  $("dots").innerHTML=list.map((_,i)=>`<i class="${i===gi?"on":""}"></i>`).join("");
  $("prevBtn").classList.toggle("hidden", gi===0);
  const last = gi===list.length-1;
  $("nextBtn").classList.toggle("hidden", last);
  $("pledgeBtn").classList.toggle("hidden", !last);
}
function card(d){ const n=(GANGA[lang]||GANGA.en).length; gi=Math.max(0,Math.min(n-1,gi+d)); renderCard(); }
(()=>{ let x0=null; const el=$("gcard");
  el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  el.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>45){ const dir = dx<0?1:-1; card(lang==="he"?-dir:dir); } }); })();

async function makePledge(){
  const W2=1080,H=1350,c=document.createElement("canvas"); c.width=W2; c.height=H; const x=c.getContext("2d");
  x.fillStyle="#1d5bd6"; x.fillRect(0,0,W2,H);
  // hills
  x.fillStyle="#3b74e6"; x.beginPath(); x.moveTo(0,980); x.lineTo(200,820); x.lineTo(380,940); x.lineTo(600,760); x.lineTo(820,930); x.lineTo(1080,800); x.lineTo(1080,1350); x.lineTo(0,1350); x.fill();
  // river + waves
  x.fillStyle="#123f9e"; x.fillRect(0,1060,W2,290);
  x.strokeStyle="rgba(255,255,255,.7)"; x.lineWidth=8; x.lineCap="round";
  for(const y of [1120,1200,1280]){ x.beginPath(); for(let i=0;i<=W2;i+=10) x.lineTo(i,y+Math.sin(i/45)*10); x.stroke(); }
  // diya
  x.save(); x.translate(W2/2,330); x.scale(5,5); x.lineJoin="round";
  x.fillStyle="#ffb020"; x.strokeStyle="#fff"; x.lineWidth=2;
  x.fill(new Path2D("M0 -6c-6-6-3-13 0-17 3 4 6 11 0 17z")); x.stroke(new Path2D("M0 -6c-6-6-3-13 0-17 3 4 6 11 0 17z"));
  x.fillStyle="#fff"; x.fill(new Path2D("M-18 0c4 9 32 9 36 0z"));
  x.restore();
  x.textAlign="center"; x.fillStyle="#fff"; x.direction = lang==="he"?"rtl":"ltr";
  const P=PLEDGE[lang]||PLEDGE.en, f="'Baloo 2','Mukta',system-ui,sans-serif";
  x.font=`600 54px ${f}`; x.fillText(P[0],W2/2,520);
  x.font=`800 84px ${f}`; wrap(x,P[1],W2/2,625,W2-140,98);
  x.fillStyle="#d6e4ff"; x.font=`600 40px ${f}`; wrap(x,P[2],W2/2,830,W2-160,54);
  x.fillStyle="#fff"; x.font=`500 34px ${f}`;
  x.fillText(new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})+"  |  Rishikesh",W2/2,H-130);
  x.font=`700 38px ${f}`; x.fillText(CONFIG.appName.en+(location.host?"  |  "+location.host:""),W2/2,H-70);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  pledgeFile=new File([blob],"my-ganga-pledge.png",{type:"image/png"});
  $("pledgeImg").src=URL.createObjectURL(blob); $("pledgeImg").style.display="block";
  $("pledgeShare").classList.remove("hidden"); toast(t("pledgeDone"));
  setTimeout(()=>$("pledgeImg").scrollIntoView({behavior:"smooth"}),60);
}
function wrap(x,text,cx,y,maxW,lh){
  const words=text.split(" "); let line="", yy=y;
  for(const w of words){ const test=line?line+" "+w:w; if(x.measureText(test).width>maxW && line){ x.fillText(line,cx,yy); line=w; yy+=lh; } else line=test; }
  x.fillText(line,cx,yy);
}
async function sharePledge(){
  if(!pledgeFile) return;
  const text=`${(PLEDGE[lang]||PLEDGE.en).slice(0,2).join(" ")}. ${location.href.split("#")[0]}`;
  try{ if(canShareFile(pledgeFile)){ await navigator.share({files:[pledgeFile],text}); return; } }
  catch(e){ if(e && e.name==="AbortError") return; }
  saveFile(pledgeFile);
}

/* ---------------- Toast ---------------- */
let tt; function toast(m,ms=2200){ const el=$("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),ms); }

/* ---------------- Start ---------------- */
setLang(lang);
show(location.hash.slice(1)||"home");
</script>
